[package]
name = "tender-native"
version = "0.1.0"
description = "Tender without Anchor: same instructions and accounts, a fraction of the size"
edition = "2021"
rust-version = "1.84"

[lib]
crate-type = ["cdylib", "lib"]
name = "tender_native"

[features]
default = ["custom-panic"]
custom-panic = []
no-entrypoint = []

[dependencies]
solana-program = "2.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap"))'] }
